[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-calibration-platform"
version = "1.0.0"
description = "Probability calibration platform built from scratch: Platt scaling, isotonic regression, histogram binning and temperature scaling over from-scratch logistic regression and k-NN, cross-fitted fitting, ECE/MCE/Brier/log-loss reliability metrics, per-slice calibration, PSI/KS drift-triggered recalibration, a gated versioned calibrator registry with rollback, a hash-chained audit log and latency-budgeted serving — all on seeded synthetic data."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["calibplat"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
